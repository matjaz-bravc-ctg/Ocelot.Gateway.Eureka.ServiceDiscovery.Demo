services:
    eureka-server:
        environment:
            - EUREKA_SERVER_ENABLE_SELF_PRESERVATION=false
        ports:
            - 8761:8761

    servicea.openapi:
        environment:
            - ASPNETCORE_ENVIRONMENT=Docker
            - ASPNETCORE_URLS=http://+:9100
            - Eureka__Client__ServiceUrl=http://eureka-server:8761/eureka/
        ports:
            - 9100:9100
        depends_on:
            eureka-server:
                condition: service_healthy

    serviceb.openapi:
        environment:
            - ASPNETCORE_ENVIRONMENT=Docker
            - ASPNETCORE_URLS=http://+:9200
            - Eureka__Client__ServiceUrl=http://eureka-server:8761/eureka/
        ports:
            - 9200:9200
        depends_on:
            eureka-server:
                condition: service_healthy

    servicec.openapi:
        environment:
            - ASPNETCORE_ENVIRONMENT=Docker
            - ASPNETCORE_URLS=http://+:9300
            - Eureka__Client__ServiceUrl=http://eureka-server:8761/eureka/
        ports:
            - 9300:9300
        depends_on:
            eureka-server:
                condition: service_healthy

    services.gateway:
        environment:
            - ASPNETCORE_ENVIRONMENT=Docker
            - Eureka__Client__ServiceUrl=http://eureka-server:8761/eureka/
        ports:
            - 9500:8080
        depends_on:
            eureka-server:
                condition: service_healthy
            servicea.openapi:
                condition: service_started
            serviceb.openapi:
                condition: service_started
            servicec.openapi:
                condition: service_started
